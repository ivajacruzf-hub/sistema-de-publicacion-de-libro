<div>
    <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h3 class="text-xl font-bold text-slate-950">Listado de usuarios</h3>
            <p class="mt-1 text-sm text-slate-600">Usuarios registrados en el sistema.</p>
        </div>
        <button id="newUserButton" type="button" class="w-fit rounded-lg bg-slate-950 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-800">
            Nuevo usuario
        </button>
    </div>

    <form id="userForm" class="mt-5 hidden rounded-lg border border-slate-200 bg-slate-50 p-4">
        <input id="userId" type="hidden">
        <div class="grid gap-3 md:grid-cols-4">
            <input id="username" required placeholder="Usuario" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm">
            <input id="password" type="password" placeholder="Contraseña" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm">
            <select id="rol" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm">
                <option value="Lector">Lector</option>
                <option value="Personal">Personal</option>
                <option value="Administrador">Administrador</option>
            </select>
            <label class="flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm">
                <input id="activo" type="checkbox" checked>
                Usuario activo
            </label>
        </div>
        <div class="mt-3 flex gap-2">
            <button type="submit" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white">Guardar usuario</button>
            <button id="cancelUserButton" type="button" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700">Cancelar</button>
        </div>
        <p id="userFormMessage" class="mt-3 text-sm"></p>
    </form>

    <div class="mt-5 overflow-hidden rounded-lg border border-slate-200 bg-white">
        <table class="min-w-full divide-y divide-slate-200 text-left text-sm">
            <thead class="bg-slate-50 text-xs uppercase text-slate-500">
    <tr>
        <th class="px-4 py-3 font-semibold">ID</th>
        <th class="px-4 py-3 font-semibold">Usuario</th>
        <th class="px-4 py-3 font-semibold">Rol</th>
        <th class="px-4 py-3 font-semibold">Estado</th>
        <th class="px-4 py-3 font-semibold">Registro</th>
        <th class="px-4 py-3 font-semibold">Acciones</th>
    </tr>
</thead>
            <tbody id="userTableList" class="divide-y divide-slate-100 text-slate-700"></tbody>
        </table>
    </div>
</div>
